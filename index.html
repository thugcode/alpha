<script>/* config.js를 고친 직후에도 옛 파일이 캐시에서 읽히지 않도록 매번 새로 받는다 */document.write('<script src="config.js?v='+Date.now()+'"><\/script>')</script>
<script src="vendor/supabase.js"></script>
<script>
// ===================== 알파 웹: Supabase 연결층 =====================
// 앱 본체는 claude.use("db" | "user" | "downloads")로 저장소를 쓴다.
// 여기서 같은 모양의 함수를 Supabase(로그인 + 테이블)로 구현해, 본체 코드는 거의 그대로 둔다.
(function(){
  const C=window.ALPHA_CONFIG||{};
  const URL_=String(C.SUPABASE_URL||"").trim().replace(/\/+$/,""),KEY=String(C.SUPABASE_ANON_KEY||"").trim();
  // 로그인 칸을 못 띄우는 이유를 화면에 정확히 보여 주기 위해 하나씩 확인한다
  let reason="";
  if(!window.ALPHA_CONFIG)reason="config.js 파일을 찾지 못했다. 저장소 맨 위(index.html 옆)에 config.js가 있는지 확인한다.";
  else if(!window.supabase)reason="vendor/supabase.js 파일을 찾지 못했다. 저장소에 vendor 폴더와 그 안의 supabase.js가 올라갔는지 확인한다.";
  else if(!URL_||/YOUR_|여기에/.test(URL_))reason="config.js의 SUPABASE_URL이 아직 예시 값이다. Project URL을 붙여 넣고 저장(Commit)한다.";
  else if(!/^https:\/\/[^\s"']+\.supabase\.(co|in|net)$/.test(URL_))reason="config.js의 SUPABASE_URL 모양이 이상하다: "+URL_+" (https://xxxx.supabase.co 형태여야 한다)";
  else if(!KEY||/YOUR_|여기에/.test(KEY))reason="config.js의 SUPABASE_ANON_KEY가 아직 예시 값이다. 공개 키(sb_publishable_… 또는 eyJ…)를 붙여 넣고 저장한다.";
  else if(/^sb_secret_/.test(KEY))reason="config.js에 Secret key가 들어 있다. 지금 바로 지우고 Publishable key로 바꾼다(Secret key는 Supabase에서 새로 발급받는다).";
  let sb=null;
  if(!reason){try{sb=window.supabase.createClient(URL_,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){reason="Supabase 연결을 만들지 못했다: "+((e&&e.message)||e)}}
  const configured=!!sb;

  let decide,decidedValue;const decided=new Promise(r=>{decide=v=>{if(decidedValue!==undefined)return;decidedValue=v;r(v)}});
  let session=null;
  const AUTH=window.AUTH={configured,sb,decided,reason,
    get email(){return session&&session.user?session.user.email:""},
    wantOpen:false,wantReset:false,
    login(){AUTH.wantOpen=true;window.dispatchEvent(new Event("alpha-auth-open"))},
    skip(){decide(null);AUTH.wantOpen=false;window.dispatchEvent(new Event("alpha-auth-close"))},
    async logout(){try{if(sb)await sb.auth.signOut()}catch(_){}try{["alpha-proto-v2","alpha-proto-v2-watch"].forEach(k=>localStorage.removeItem(k))}catch(_){}location.replace(location.pathname)}
  };
  if(!sb){decide(null);AUTH.wantOpen=true}
  else{
    sb.auth.getSession().then(({data})=>{session=data&&data.session;if(session)decide(session);else AUTH.login()}).catch(()=>AUTH.login());
    sb.auth.onAuthStateChange((ev,s)=>{
      // 비밀번호 재설정 메일의 링크로 들어온 경우: 새 비밀번호를 정하는 화면을 띄운다
      if(ev==="PASSWORD_RECOVERY"){session=s||session;AUTH.wantReset=true;if(s)decide(s);window.dispatchEvent(new Event("alpha-auth-reset"));return}
      if(ev==="SIGNED_IN"&&s&&AUTH.wantReset){session=s;decide(s);return}
      if(ev==="SIGNED_IN"&&s){const was=session;session=s;AUTH.wantOpen=false;window.dispatchEvent(new Event("alpha-auth-close"));
        // 로그인 없이 둘러보다가 로그인했으면 새로 불러와야 계정 기록이 연결된다
        if(decidedValue===null||(was&&was.user&&was.user.id!==s.user.id))location.replace(location.pathname);else decide(s)}
      else if(s)session=s;
    });
  }

  // ---- 경로 → 테이블 ----
  // data/users/<id>/<문서>, watch/<id>, feeds/<id> → user_docs(user_id, doc_id)
  // pool/<id> → pool(user_id)
  function route(full){const s=full.split("/");
    if(s[0]==="data"&&s[1]==="users"&&s.length===4)return{t:"user_docs",uid:s[2],doc:s[3]};
    if((s[0]==="watch"||s[0]==="feeds")&&s.length===2)return{t:"user_docs",uid:s[1],doc:s[0]};
    if(s[0]==="pool"&&s.length===2)return{t:"pool",uid:s[1]};
    throw{code:"invalid_argument",message:"알 수 없는 경로: "+full}}
  const fail=e=>{throw{code:e&&(e.code==="42501"||e.status===401||e.status===403)?"invalid_argument":"unavailable",message:(e&&e.message)||String(e)}};
  const snap=(id,data,sig)=>({id,exists:data!=null,data:()=>data==null?undefined:JSON.parse(JSON.stringify(data)),metadata:{fromCache:false,hasPendingWrites:false},_sig:sig});

  function docRef(full){const r=route(full),id=full.split("/").pop();
    async function get(){
      if(r.t==="user_docs"){const {data,error}=await sb.from("user_docs").select("data,updated_at").eq("user_id",r.uid).eq("doc_id",r.doc).maybeSingle();if(error)fail(error);return snap(id,data?data.data:null,data?data.updated_at:"none")}
      const {data,error}=await sb.from("pool").select("m,at").eq("user_id",r.uid).maybeSingle();if(error)fail(error);return snap(id,data?{m:data.m,at:data.at}:null,data?JSON.stringify(data):"none")}
    return{get,
      async set(d){d=JSON.parse(JSON.stringify(d));
        if(r.t==="user_docs"){const {error}=await sb.from("user_docs").upsert({user_id:r.uid,doc_id:r.doc,data:d,updated_at:new Date().toISOString()},{onConflict:"user_id,doc_id"});if(error)fail(error);return}
        const {error}=await sb.from("pool").upsert({user_id:r.uid,m:d.m||{},at:d.at||null},{onConflict:"user_id"});if(error)fail(error)},
      async delete(){const q=r.t==="user_docs"?sb.from("user_docs").delete().eq("user_id",r.uid).eq("doc_id",r.doc):sb.from("pool").delete().eq("user_id",r.uid);const {error}=await q;if(error)fail(error)},
      // 실시간 대신: 처음 한 번 + 화면으로 돌아올 때 + 30초마다 다시 읽고, 바뀌었을 때만 알린다
      onSnapshot(next,err){let last=null;const tick=async()=>{try{const s=await get();if(s._sig!==last){last=s._sig;next(s)}}catch(e){err&&err(e)}};
        tick();const h=setInterval(()=>{if(!document.hidden)tick()},30000);const v=()=>{if(!document.hidden)tick()};document.addEventListener("visibilitychange",v);
        return()=>{clearInterval(h);document.removeEventListener("visibilitychange",v)}}}}
  const db={collection(path){return{
    doc:id=>docRef(path+"/"+id),
    onSnapshot(next,err){if(path!=="pool"){err&&err({code:"invalid_argument"});return()=>{}}
      const tick=async()=>{try{const {data,error}=await sb.from("pool").select("user_id,m,at");if(error)fail(error);

  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.25);flex:none}
.brand{display:flex;align-items:center;gap:10px}
.brand .lvl{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:400}
.date{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right}
.tag{display:inline-block;font-family:var(--f-body);font-size:11px;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-left:4px}
h2{font-family:var(--f-display);font-weight:500;font-size:18px;letter-spacing:-.02em;margin:0;text-wrap:balance}
h3{font-size:14px;margin:0}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);max-width:65ch;margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:16px}

/* 알파 지수 */
.index{background:var(--metal);color:var(--ink);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);border-radius:16px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.index .label{color:var(--muted)}
.big{font-family:var(--f-num);font-size:60px;font-weight:300;line-height:1;letter-spacing:-.03em}
.rank{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.3}
.rank em{font-style:normal;color:var(--hero-accent)}
.gauge{grid-column:1/-1;position:relative;height:6px;border-radius:3px;background:#2C2C30}
.gauge i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--hero-accent)}
.gauge b{position:absolute;top:-5px;bottom:-5px;left:50%;width:2px;background:var(--muted)}
.gauge-legend{grid-column:1/-1;display:flex;justify-content:space-between;font-family:var(--f-num);font-size:11px;color:var(--muted);margin-top:-10px}

/* 흐름 스트립 */
.flow{display:grid;grid-template-columns:1fr 18px 1fr 18px 1fr;align-items:stretch}
.flow .cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer;color:inherit;font:inherit;text-align:left}
.flow .cell:focus-visible{outline:2px solid var(--accent)}
.flow .cell.res{border-color:#4A4A50;background:var(--metal)}
.flow .arrow{display:grid;place-items:center;color:var(--muted);font-size:14px}
.flow .v{font-family:var(--f-num);font-weight:400;font-size:22px;line-height:1.1}
.flow .s{font-size:11px;color:var(--muted)}

/* 스탯 시트 */
.sheet{overflow:hidden}
.row{display:grid;grid-template-columns:88px 1fr 40px;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit;font:inherit}
.row:first-child{border-top:0}
.row:hover{background:var(--raised)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row .name{font-weight:500;font-size:14px;line-height:1.25}
.row .sub{font-size:12px;color:var(--muted);min-width:0}
.bar{position:relative;height:10px;background:var(--bg);border-radius:5px;margin-bottom:5px}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#9C9CA2,#EDEDEA);border-radius:5px;transition:width .4s}
.bar b{position:absolute;top:-3px;bottom:-3px;left:50%;width:2px;background:var(--avg)}
.score{text-align:right;font-family:var(--f-num);font-weight:400;font-size:18px}
.score .dlt{display:block;font-size:11px;color:var(--muted);line-height:1.2}.score .dlt.up{color:var(--good)}.score .dlt.dn{color:var(--bad)}
.sheet-foot{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.detail{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin:0 12px 12px}
.mline{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:13px}
.tip{font-size:13px}

/* 체크/퀘스트 */
.list{display:flex;flex-direction:column;gap:8px}
.q{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.q:focus-visible{outline:2px solid var(--accent)}
.q .box{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;color:var(--on-accent);font-size:14px;font-weight:500}
.q.done .box{background:var(--accent);border-color:var(--accent)}
.q.done .qt{color:var(--muted);text-decoration:line-through}
.q .qd{font-size:11px;color:var(--muted)}
.xp{font-family:var(--f-num);font-size:12px;color:var(--accent);font-weight:400}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--good)}
.progress{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}

/* 폼 */
.form{display:grid;gap:8px}
.form .r{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.form .r3{display:grid;gap:8px;grid-template-columns:1.2fr 1fr auto}
input,select{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 10px;min-width:0;width:100%;-webkit-appearance:none;appearance:none}
input[type=date]{min-height:44px}
textarea{font-size:16px!important}
.stepin{font-size:16px!important}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.btn{height:42px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font:inherit;font-weight:500;cursor:pointer;padding:0 16px}
.btn.ghost{background:none;color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.seg:focus-visible{outline:2px solid var(--accent)}

/* 돈 */
.msum{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.msum>div{background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.msum .v{font-family:var(--f-num);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.msum .hl{grid-column:1/-1;background:var(--metal)}
.msum .hl .v{font-size:26px;color:var(--accent)}
.tx{display:grid;grid-template-columns:44px 1fr auto 28px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px}
.tx:first-child{border-top:0}
.tx .d{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.tx .m{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-family:var(--f-num);font-weight:400;text-align:right}
.chip{display:inline-block;font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.chip.need{color:var(--need);background:color-mix(in srgb,var(--need) 14%,transparent)}
.chip.want{color:var(--want);background:color-mix(in srgb,var(--want) 14%,transparent)}
.chip.invest{color:var(--invest);background:color-mix(in srgb,var(--invest) 14%,transparent)}
.x{width:28px;height:28px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:6px;font-size:16px}
.x:hover{background:var(--bg)}
.x:focus-visible{outline:2px solid var(--accent)}
.cbar{display:grid;grid-template-columns:76px 1fr 72px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.cbar .t{height:12px;background:var(--bg);border-radius:3px;position:relative;overflow:hidden}
.cbar .t i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.cbar .a{font-family:var(--f-num);text-align:right;font-size:12px}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--bg)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.insight{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 14px;border-top:1px solid var(--line);font-size:13.5px}
.insight:first-child{border-top:0}
.sev{font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:4px;height:fit-content;white-space:nowrap}
.sev.good{color:var(--good);background:var(--good-soft)}
.sev.warn{color:var(--warn);background:var(--warn-soft)}
.sev.bad{color:var(--bad);background:var(--bad-soft)}
.sev.info{color:var(--accent);background:var(--accent-soft)}
.chal{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.chal:first-child{border-top:0}
.chal .p{font-family:var(--f-num);font-size:12px}

/* 기록 */
.erow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.erow.first{border-top:0}
.erow .meta{font-size:12px;color:var(--muted)}
.dhead{padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line)}
.dhead:first-child{border-top:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.step button:focus-visible{outline:2px solid var(--accent)}
.step output{min-width:52px;text-align:center;font-family:var(--f-num);font-weight:400}
.auto{font-size:12px;color:var(--muted);font-family:var(--f-num)}
.stepwrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* 기준표 */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;color:var(--muted)}
td.n,th.n{font-family:var(--f-num);text-align:right}
tr:last-child td{border-bottom:0}
.basis{display:inline-block;font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:4px;white-space:nowrap}
.basis.official{color:var(--good);background:var(--good-soft)}
.basis.est{color:var(--warn);background:var(--warn-soft)}
.basis.pool{color:var(--accent);background:var(--accent-soft)}
.linkbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.linkbtn.danger{border-color:var(--bad);color:var(--bad)}
.linkbtn:focus-visible{outline:2px solid var(--accent)}

/* 탭 바 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(14,14,16,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:11.5px;font-weight:500;padding:11px 0 13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"] svg{filter:drop-shadow(0 0 6px rgba(237,237,234,.35))}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-accent);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6;white-space:nowrap}
.toast.show{opacity:1}

/* 온보딩 */
.ob{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ob .in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:20px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:32px 28px}
.ob .hero{font-family:var(--f-display);font-weight:500;font-size:clamp(34px,9vw,52px);line-height:1.1;letter-spacing:-.02em}
.ob .hero span{color:var(--muted)}
.ob .mark{width:88px;height:88px;border-radius:22px}
.ob p{margin:0;max-width:60ch}
.ob .lead{font-size:17px;line-height:1.6}
.ob .def{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ob .def div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.ob .def b{display:block;font-family:var(--f-display);font-weight:500;font-size:16px}
.ob .def small{color:var(--muted);font-size:12px}
.memo{border-left:2px solid var(--ink);background:var(--surface);border-radius:0 10px 10px 0;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.layer b{font-family:var(--f-display);font-weight:500;font-size:16px}
.layer.res{border-color:#4A4A50;background:var(--metal)}
.layer p{font-size:13px;color:var(--muted)}
.down{text-align:center;color:var(--muted);font-size:12px;line-height:1}
.ob .foot{margin-top:auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.pager{display:flex;gap:6px}
.pager i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.pager i.on{background:var(--accent)}


/* 기반 카드 */
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bhead{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 14px;width:100%;background:none;border:0;text-align:left;color:inherit;font:inherit}
button.bhead{cursor:pointer}
button.bhead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.bhead .box{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;color:var(--on-accent);font-size:14px;font-weight:500}
.bhead.done .box{background:var(--accent);border-color:var(--accent)}
.bhead .qd{font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bbody{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.meals{display:flex;flex-direction:column}
.meal{display:grid;grid-template-columns:40px 1fr auto 28px;gap:8px;align-items:center;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.meal .slot{font-size:11px;font-weight:500;color:var(--muted)}
.meal .m{min-width:0;overflow-wrap:anywhere}
.meal .d{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.mday{font-size:11px;font-weight:500;color:var(--muted);padding:10px 0 2px}
details summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--accent);padding:4px 0}
details summary:focus-visible{outline:2px solid var(--accent)}
.scr{display:flex;flex-direction:column;gap:6px}
.big2{font-family:var(--f-num);font-size:40px;font-weight:400;line-height:1}
.big2 small{font-size:14px;margin-left:2px;color:var(--muted)}
.big2.good{color:var(--good)}.big2.warn{color:var(--warn)}.big2.bad{color:var(--bad)}
.meter{position:relative;height:10px;background:var(--bg);border-radius:5px;overflow:visible}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--good)}
.meter i.warn{background:var(--warn)}.meter i.bad{background:var(--bad)}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn)}
.meter b.lim{background:var(--bad)}
.mlegend{position:relative;height:14px;font-family:var(--f-num);font-size:10px;color:var(--muted)}
.mlegend span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.mlegend span:first-child{left:0;transform:none}
.mlegend span:last-child{transform:none}
.warnbar{display:block;width:100%;text-align:left;border:0;border-radius:10px;padding:12px 14px;font:inherit;font-size:13.5px;line-height:1.45}
.warnbar.bad{background:var(--bad-soft);color:var(--bad)}
.warnbar.warn{background:var(--warn-soft);color:var(--warn)}
.warnbar.info{background:var(--raised);color:var(--ink);border:1px solid var(--line);cursor:pointer}
.warnbar.info:focus-visible{outline:2px solid var(--accent)}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--bg);border-radius:10px;padding:12px 14px}
#tdisp{font-size:36px;font-weight:400;letter-spacing:.02em}
textarea{width:100%;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:10px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--accent)}
.alarm{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.steps{margin:6px 0;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:4px}
code{font-family:var(--f-num);font-size:12px;background:var(--bg);padding:1px 5px;border-radius:4px}

.msum .wide{grid-column:1/-1}
.tx .a.plus{color:var(--good)}.tx .a.inv{color:var(--invest)}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.tabs3 button{border:0;background:none;color:var(--muted);font:inherit;font-weight:500;font-size:13.5px;padding:8px 0;border-radius:7px;cursor:pointer}
.tabs3 button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.tabs3 button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg.imp[aria-pressed="true"]{border-color:var(--want);background:color-mix(in srgb,var(--want) 14%,transparent);color:var(--want)}
.audit{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:6px}
.apct{font-size:30px;font-weight:400;line-height:1}
.apct small{font-size:14px;color:var(--muted);margin-left:2px}
.rv{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px}
.rv .d{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.rv .m{min-width:0}
.rvb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rvb .seg{font-size:12px;padding:5px 10px}
.q.edit{cursor:default}
.q .drag{border-style:dashed;color:var(--muted);font-size:13px}
.qact{display:flex;gap:6px}
.qact .seg{font-size:12px;padding:5px 10px}
.seg.danger{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);font-weight:500}
.qform{display:flex;flex-direction:column;gap:8px;cursor:default}
[data-bsub]{height:38px;color:var(--muted);border-style:dashed}
.seg:disabled{opacity:.3;cursor:default}
.xpinfo{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.xpinfo p{padding:4px 0 6px}
#q-edit[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
@media (max-width:400px){.rv{grid-template-columns:34px 1fr}.rvb{grid-column:1/-1;justify-content:flex-start}.q.edit{grid-template-columns:20px 1fr}.qact{grid-column:1/-1}}

.pager i.past{background:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.flabel{font-size:13px;font-weight:400}
.recs{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rec-head{display:flex;justify-content:space-between;align-items:center}
.rec{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-top:8px;border-top:1px dashed var(--line)}
.rec .qd{font-size:11.5px;color:var(--muted)}
.rec .seg{white-space:nowrap}
.ob .index{margin:0}
b,strong{font-weight:500}
h3{font-weight:500}

.stepin{width:64px;height:34px;text-align:center;font-family:var(--f-num);font-variant-numeric:tabular-nums;padding:0 4px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.stepin:focus-visible{outline:1px solid var(--ink);outline-offset:0}
.mdesc summary{font-size:11.5px;color:var(--muted);font-weight:400;padding:2px 0}
.mdesc p,.mdesc-inline{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.5;max-width:46ch}

.backbar{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer}
.backbar:hover{border-color:#4A4A50}
.backbar:focus-visible{outline:1px solid var(--ink)}
.backbar .arr{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--on-accent);font-size:16px}
.backbar b{display:block;font-size:14px}
.backbar small{display:block;font-size:12px;color:var(--muted)}

nav.tabs .tab-alpha{color:var(--ink)}
nav.tabs .tab-alpha .mark.sm{width:30px;height:30px;border-radius:8px;margin-top:-10px;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 4px 14px rgba(0,0,0,.7)}
nav.tabs .tab-alpha[aria-selected="true"] .mark.sm{box-shadow:0 0 0 2px var(--ink),0 4px 14px rgba(0,0,0,.7)}
.hright{display:flex;align-items:center;gap:10px}
.gear{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.gear svg{width:18px;height:18px}
.gear:focus-visible{outline:1px solid var(--ink)}
.ahero{background:var(--metal);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px}
.ah{font-size:22px;font-weight:500}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.jump a{font-size:12.5px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:5px 11px;background:var(--surface)}
.jump a:focus-visible{outline:1px solid var(--ink)}
.t4{grid-template-columns:repeat(4,1fr)}
.pform{display:flex;flex-direction:column;gap:14px}
.opp{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.opp:first-child{border-top:0}
.otop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.otype{font-size:10.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.dd{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.dd.hot{color:var(--bad)}
.otitle{color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;line-height:1.4}
.otitle:hover{text-decoration:underline}

<div class="app" id="app"></div>
<div class="ob" id="auth" role="dialog" aria-modal="true" aria-label="로그인" hidden style="z-index:40">
  <div class="in" style="justify-content:center">
    <span class="mark" role="img" aria-label="알파 아이콘" style="width:72px;height:72px;border-radius:18px"></span>
    <div class="hero" style="font-size:36px">알파</div>
    <p class="lead" id="auth-lead">로그인하면 기록이 계정에 저장되어 어느 기기에서나 이어진다.</p>
    <div class="tabs3" id="auth-tabs" role="tablist" aria-label="로그인 방식" style="grid-template-columns:repeat(2,1fr)">
      <button role="tab" data-amode="login" aria-selected="true">로그인</button>
      <button role="tab" data-amode="signup" aria-selected="false">처음이면 가입</button>
    </div>
    <div class="field" id="auth-form">
      <label for="auth-email">이메일</label>
      <input id="auth-email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">
      <label for="auth-pw">비밀번호 <span class="note" id="auth-pwhint">(6자 이상)</span></label>
      <input id="auth-pw" type="password" autocomplete="current-password" placeholder="비밀번호">
      <button class="btn" id="auth-go">로그인</button>
      <button class="linkbtn" id="auth-forgot" style="align-self:flex-start">비밀번호를 잊었다</button>
    </div>
    <div class="field" id="auth-reset" hidden>
      <label for="auth-newpw">새 비밀번호 (6자 이상)</label>
      <input id="auth-newpw" type="password" autocomplete="new-password" placeholder="새 비밀번호">
      <button class="btn" id="auth-setpw">새 비밀번호 저장</button>
    </div>
    <p class="note" id="auth-msg" role="status"></p>
    <button class="linkbtn" id="auth-skip" style="align-self:flex-start">로그인 없이 둘러보기 (이 기기에만 저장)</button>
  </div>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id),box=$("auth"),msg=t=>{$("auth-msg").textContent=t||""};
  let mode="login";
  function setMode(m){mode=m;document.querySelectorAll("[data-amode]").forEach(b=>b.setAttribute("aria-selected",b.dataset.amode===m));
    $("auth-go").textContent=m==="login"?"로그인":"가입하고 시작하기";$("auth-pw").autocomplete=m==="login"?"current-password":"new-password";
    $("auth-forgot").hidden=m!=="login";msg("")}
  function open(){box.hidden=false;const ok=AUTH.configured;
    $("auth-tabs").hidden=!ok;$("auth-form").hidden=!ok;$("auth-reset").hidden=true;
    msg(ok?"":"로그인 칸을 띄우지 못했다. "+(AUTH.reason||"서버 설정(config.js)을 확인한다.")+" 고친 뒤 새로고침한다.");
    setTimeout(()=>{const i=$("auth-email");if(ok&&i)i.focus()},50)}
  function openReset(){box.hidden=false;$("auth-tabs").hidden=true;$("auth-form").hidden=true;$("auth-reset").hidden=false;$("auth-skip").hidden=true;
    $("auth-lead").textContent="새로 쓸 비밀번호를 정한다.";msg("")}
  window.addEventListener("alpha-auth-open",open);
  window.addEventListener("alpha-auth-reset",openReset);
  window.addEventListener("alpha-auth-close",()=>{box.hidden=true});
  document.querySelectorAll("[data-amode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.amode)));
  const errText=e=>{const m=((e&&(e.message||e.error_description))||"")+"";
    if(/invalid login credentials/i.test(m))return"이메일이나 비밀번호가 맞지 않다. 처음이라면 '처음이면 가입'을 누른다.";
    if(/already registered|already exists/i.test(m))return"이미 가입한 이메일이다. '로그인'에서 들어간다.";
    if(/password/i.test(m)&&/6|short|least/i.test(m))return"비밀번호는 6자 이상이어야 한다.";
    if(/email not confirmed/i.test(m))return"이메일 확인이 아직 안 됐다. 받은 메일의 링크를 누르고 다시 로그인한다.";
    if(/rate|limit|429/i.test(m))return"너무 자주 시도했다. 잠시 뒤에 다시 시도한다.";
    return"문제가 생겼다: "+m};
  $("auth-go").addEventListener("click",async()=>{
    const email=$("auth-email").value.trim(),password=$("auth-pw").value;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){msg("이메일 주소를 확인한다.");return}
    if(password.length<6){msg("비밀번호는 6자 이상이어야 한다.");return}
    $("auth-go").disabled=true;msg(mode==="login"?"로그인하는 중이다…":"가입하는 중이다…");
    try{
      if(mode==="login"){const {error}=await AUTH.sb.auth.signInWithPassword({email,password});if(error)throw error;msg("")}
      else{const {data,error}=await AUTH.sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
        if(data&&data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){setMode("login");msg("이미 가입한 이메일이다. 비밀번호를 넣고 로그인한다.");return}
        if(!data||!data.session)msg("가입 확인 메일을 보냈다. 메일 속 링크를 누른 뒤 이 화면에서 로그인한다.");else msg("")}
    }catch(e){msg(errText(e))}finally{$("auth-go").disabled=false}});
  $("auth-forgot").addEventListener("click",async()=>{
    const email=$("auth-email").value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){msg("위에 이메일을 먼저 입력하고 다시 누른다.");return}
    try{const {error}=await AUTH.sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;
      msg(email+"로 비밀번호 재설정 메일을 보냈다. 메일 속 링크를 누르면 새 비밀번호를 정하는 화면이 열린다. 안 보이면 스팸함을 확인한다.")}
    catch(e){msg(errText(e))}});
  $("auth-setpw").addEventListener("click",async()=>{
    const password=$("auth-newpw").value;if(password.length<6){msg("비밀번호는 6자 이상이어야 한다.");return}
    $("auth-setpw").disabled=true;
    try{const {error}=await AUTH.sb.auth.updateUser({password});if(error)throw error;msg("새 비밀번호를 저장했다.");setTimeout(()=>location.replace(location.pathname),700)}
    catch(e){msg(errText(e))}finally{$("auth-setpw").disabled=false}});
  ["auth-email","auth-pw"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")$("auth-go").click()}));
  $("auth-skip").addEventListener("click",()=>AUTH.skip());
  if(AUTH.wantReset)openReset();else if(AUTH.wantOpen)open();
})();
</script>

// profile: {status,time,focus:[], hobbies:[]}, get: 지표값 함수, exclude: 이미 있는 퀘스트 제목
function recommend(profile,get,exclude,n,offset=0){
  const lvlMax=profile.time||2;
  const ds=DOMAINS.map(d=>({d,s:scoreV(d,get),focus:(profile.focus||[]).includes(d.id)}))
    .sort((a,b)=>(b.focus-a.focus)||(a.s-b.s));
  const cands=[];
  ds.forEach((x,rank)=>{
    // 영역 안에서 가장 약한 지표를 먼저 겨냥
    const ms=x.d.metrics.filter(m=>!m.auto).map(m=>({m,v:get(m),sc:mScoreV(m,get(m))})).sort((a,b)=>(a.sc??50)-(b.sc??50));
    QLIB.filter(q=>q.d===x.d.id&&q.lvl<=lvlMax&&(!q.who||q.who.includes(profile.status))&&!exclude.includes(q.t)).forEach(q=>{
      const mi=ms.findIndex(o=>o.m.k===q.feed.k);if(mi<0)return;const tm=ms[mi];
      const pr=rank*10+mi*3+(lvlMax-q.lvl)*(lvlMax>=2?1:0)+(q.who?-1:0);
      const reason=x.focus?`집중 영역으로 고른 ${x.d.name}`:`${x.d.name} ${x.s}점`+(tm.sc!=null&&tm.v!=null?` · ${tm.m.l} ${fv(tm.m,tm.v)}${tm.m.u} (평균 ${fv(tm.m,effAvg(tm.m))})`:'');
      cands.push({...q,pr,reason});
    });
  });
  cands.sort((a,b)=>a.pr-b.pr);
  // 영역이 고르게 섞이도록 라운드로빈
  const out=[],used={};const pool=cands.slice();
  for(let round=0;out.length<n+offset&&pool.length&&round<6;round++){
    for(const c of pool.slice()){if(out.length>=n+offset)break;if((used[c.d]||0)>round)continue;if(out.some(o=>o.t===c.t))continue;
      out.push(c);used[c.d]=(used[c.d]||0)+1;pool.splice(pool.indexOf(c),1)}
  }
  return out.slice(offset,offset+n);
}

function barChart(items,{fmt:f=v=>v,grid=[],H=140}={}){
  const W=320,pb=22,pt=16,n=items.length,bw=Math.min(28,(W/n)*.62),gap=(W-bw*n)/Math.max(1,n-1);
  const max=Math.max(...grid,...items.map(i=>i.v),1)*1.08;
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let g=`<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  grid.forEach(t=>{g+=`<line x1="0" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${W}" y="${y(t)-3}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="Roboto,sans-serif">${f(t)}</text>`});
  items.forEach((it,i)=>{const x=i*(bw+gap);
    g+=`<rect x="${x}" y="${y(it.v)}" width="${bw}" height="${Math.max(0,y(0)-y(it.v))}" rx="3" fill="${it.hl?'var(--accent)':it.c||'var(--avg)'}" opacity="${it.hl?1:.6}"/>`;
    if(it.v>0&&n<=8)g+=`<text x="${x+bw/2}" y="${y(it.v)-4}" text-anchor="middle" font-size="10" fill="var(--ink)" font-family="Roboto,sans-serif">${f(it.v)}</text>`;
    if(it.l)g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="${n>8?9:11}" fill="${it.hl?'var(--accent)':'var(--muted)'}" font-weight="${it.hl?700:400}">${it.l}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

function insights(mo){
  const out=[],ex=mo.ex,tot=mo.variable||1,{day,dim}=monthInfo();
  if(!ex.length){out.push({s:"info",t:"지출을 3일 이상 기록하면 소비 경향을 분석해 준다."});return out}
  // 1. 최대 카테고리
  const byCat=CATS.map(c=>({c,sum:ex.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.amt,0)})).sort((a,b)=>b.sum-a.sum);
  const top=byCat[0];out.push({s:"info",t:`이번 달 변동지출의 <b>${Math.round(top.sum/tot*100)}%</b>가 ${top.c.n}이다.`});
  // 2. 카페
  const cafe=ex.filter(e=>e.cat==="cafe");
  if(cafe.length>=4){const perWeek=cafe.length/day*7,avgAmt=cafe.reduce((s,e)=>s+e.amt,0)/cafe.length;
    const r1k=v=>Math.round(v/1000)*1000,yearly=r1k(perWeek*52*avgAmt),saved=r1k(Math.max(0,(perWeek-2)*52*avgAmt));
    out.push({s:"warn",t:`카페에 주 <b class="num">${perWeek.toFixed(1)}</b>회, 한 번에 평균 ${won(avgAmt)}. 이 속도면 1년에 <b>${won(yearly)}</b>이다. 주 2회로 줄이면 약 ${won(saved)}을 아낄 수 있다.`})}
  // 3. 욕구 비율
  const want=ex.filter(e=>e.tag==="want").reduce((s,e)=>s+e.amt,0),wr=Math.round(want/tot*100);
  out.push(wr>35?{s:"bad",t:`욕구 지출이 <b>${wr}%</b>이다. 사기 전에 24시간 기다리는 규칙부터 시도해 본다.`}
                 :{s:"good",t:`욕구 지출이 ${wr}%로 잘 관리되고 있다.`});
  // 4. 투자성 소비
  const inv=ex.filter(e=>e.tag==="invest").reduce((s,e)=>s+e.amt,0),ir=Math.round(inv/tot*100);
  out.push(ir<10?{s:"warn",t:`자기계발·사교 취미에 쓴 돈이 ${ir}%이다. 알파가 권하는 투자성 소비는 10~20%다.`}
                :{s:"good",t:`투자성 소비(자기계발·사교 취미)가 <b>${ir}%</b>이다. 결과로 돌아오는 돈이다.`});
  // 5. 요일 패턴
  const dowSum=Array(7).fill(0),dowCnt=Array(7).fill(0);
  for(let i=0;i<day;i++){const d=new Date(monthInfo().y,monthInfo().mo,i+1);dowCnt[d.getDay()]++}
  ex.forEach(e=>{dowSum[parseKey(e.date).getDay()]+=e.amt});
  const avgs=dowSum.map((s,i)=>dowCnt[i]?s/dowCnt[i]:0),overallAvg=mo.variable/day;
  const peak=avgs.indexOf(Math.max(...avgs));
  if(overallAvg>0&&avgs[peak]/overallAvg>1.4)out.push({s:"warn",t:`${DAYS[peak]}요일 지출이 하루 평균의 <b>${(avgs[peak]/overallAvg).toFixed(1)}배</b>이다. 그날 일정을 미리 정해 두면 줄일 수 있다.`});
  // 6. 구독
  const subs=S.fixed.filter(f=>f.kind==="구독");
  if(subs.length>=2)out.push({s:"info",t:`구독 ${subs.length}개에 매달 ${won(subs.reduce((s,f)=>s+f.amt,0))}. 최근 2주간 안 쓴 게 있다면 해지 후보다.`});
  // 7. 50/30/20
  if(mo.income>0){const need=mo.fixed+ex.filter(e=>e.tag!=="want").reduce((s,e)=>s+e.amt,0)/day*dim;
    const np=Math.round(need/mo.income*100),wp=Math.round(want/day*dim/mo.income*100);
    out.push({s:"info",t:`50/30/20 규칙 대비: 필요·투자 <b>${np}%</b>(기준 50) · 욕구 <b>${wp}%</b>(기준 30) · 저축 <b>${mo.rate}%</b>(기준 20).`})}
  return out;
}

function audit(mo){
  const ex=mo.ex,tot=mo.variable;
  const valueAmt=ex.filter(e=>e.tag==="invest"||e.review==="good").reduce((s,e)=>s+e.amt,0);
  const regret=ex.filter(e=>e.review==="bad");
  const imp=ex.filter(e=>e.impulse),impAmt=imp.reduce((s,e)=>s+e.amt,0);
  const impByCat={};imp.forEach(e=>impByCat[e.cat]=(impByCat[e.cat]||0)+e.amt);
  const impTop=Object.entries(impByCat).sort((a,b)=>b[1]-a[1])[0];
  const byKind={};mo.assetList.forEach(e=>byKind[e.kind]=(byKind[e.kind]||0)+e.amt);
  return{
    value:{pct:tot?Math.round(valueAmt/tot*100):0,amt:valueAmt,regretAmt:regret.reduce((s,e)=>s+e.amt,0),regretN:regret.length},
    imp:{pct:tot?Math.round(impAmt/tot*100):0,amt:impAmt,n:imp.length,top:impTop?CATS.find(c=>c.id===impTop[0]).n:null},
    asset:{pct:mo.income?Math.round(mo.asset/mo.income*100):0,amt:mo.asset,byKind}
  };
}

let BRIEF=null,briefErr=false,oppFilter="전체",oppMore=false,profEdit=false;
// 내 알림 링크: data/users/<내 id>/watch 문서에 링크 목록, feeds 문서에 수집 결과(Claude가 업데이트 때 채움)
let WATCH=null,FEEDS={},FEEDMETA=null,watchMode="loading",watchAdd=false,refreshing=false;
function localWatch(){try{return JSON.parse(localStorage.getItem(KEY+"-watch"))||[]}catch(e){return[]}}
function saveLocalWatch(l){try{localStorage.setItem(KEY+"-watch",JSON.stringify(l))}catch(e){}}
let WDB=null,WID=null;
async function watchInit(){
  try{
    if(!window.claude||!window.claude.use)throw 0;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    const id=user?await user.id():null;if(!db||!id)throw 0;
    let cw=null;try{cw=await user.can("data.write")}catch(_){}if(cw===false)throw 0;
    WDB=db;WID=id;watchMode="db";
    // v27: 링크와 수집 결과를 watch/<id>, feeds/<id>에 둔다. 본인과 앱 운영자(소유자)만 읽을 수 있고 다른 사용자에게는 보이지 않는다.
    const old=db.collection("data/users/"+id);let oldFeeds={};
    try{const nw=await db.collection("watch").doc(id).get();if(!nw.exists){const ow=await old.doc("watch").get();const ol=ow.exists?((ow.data()||{}).links||[]):[];
      if(ol.length)await db.collection("watch").doc(id).set({links:clean(ol),updatedAt:new Date().toISOString()})}}catch(_){}
    try{const of=await old.doc("feeds").get();if(of.exists)oldFeeds=clean((of.data()||{}).byId||{})}catch(_){}
    db.collection("watch").doc(id).onSnapshot(sn=>{WATCH=sn.exists?clean((sn.data()||{}).links||[]):[];if(tab==="alpha")renderKeep()},()=>{});
    db.collection("feeds").doc(id).onSnapshot(sn=>{if(refreshing)return;const fd=sn.exists?(sn.data()||{}):{};FEEDS=sn.exists?clean(fd.byId||{}):oldFeeds;FEEDMETA=fd.manual||null;if(tab==="alpha")renderKeep()},()=>{});
  }catch(e){watchMode="local";WATCH=localWatch();if(tab==="alpha")renderKeep()}
}
function renderKeep(){const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA/.test(ae.tagName))return;const y=window.scrollY;render();window.scrollTo(0,y)}
async function saveWatch(links){WATCH=links;
  if(watchMode==="db"){try{await WDB.collection("watch").doc(WID).set({links:clean(links),updatedAt:new Date().toISOString()})}catch(e){toast("저장하지 못했다. 잠시 후 다시 시도한다")}}
  else saveLocalWatch(links)}
// ---------- 내 알림 링크 '지금 업데이트' (하루 3번) ----------
const REFRESH_LIMIT=3;
function kstDayKey(){return new Date(Date.now()+9*3600e3).toISOString().slice(0,10)}
function refreshUsed(){return FEEDMETA&&FEEDMETA.day===kstDayKey()?(FEEDMETA.used||0):0}
async function refreshFeeds(){
  if(refreshing)return;
  if(watchMode!=="db"){toast("로그인해야 지금 업데이트를 쓸 수 있다");return}
  if(!(WATCH||[]).length){toast("먼저 링크를 등록한다");return}
  if(refreshUsed()>=REFRESH_LIMIT){toast("오늘 업데이트 3번을 모두 썼다. 내일 다시 할 수 있다");return}
  const sb=window.AUTH&&window.AUTH.sb;if(!sb){toast("로그인 연결을 확인하지 못했다");return}
  refreshing=true;renderKeep();
  try{
    const {data,error}=await sb.functions.invoke("refresh-feeds",{body:{}});
    if(error){let msg="",code=0;try{code=error.context&&error.context.status;const j=await error.context.json();msg=j&&j.message;if(j&&j.used!=null)FEEDMETA={day:kstDayKey(),used:j.used,limit:j.limit}}catch(_){}
      if(!msg)msg=code===404||/Failed to send|fetch/i.test(String(error.message))?"업데이트 기능이 아직 설치되지 않았다. 운영자에게 알린다.":"업데이트하지 못했다. 잠시 후 다시 시도한다.";
      toast(msg);return}
    if(data&&data.byId){FEEDS=clean(data.byId);FEEDMETA={day:kstDayKey(),used:data.used,limit:data.limit}}
    const ok=Object.values(FEEDS).filter(f=>f&&f.status==="ok").length;
    toast(`업데이트했다 · ${ok}/${(WATCH||[]).length}개 링크에서 글을 가져왔다 · 오늘 ${REFRESH_LIMIT-(data.used||0)}번 남음`);
  }catch(e){toast("업데이트하지 못했다: "+((e&&e.message)||e))}
  finally{refreshing=false;renderKeep()}
}
function watchBlock(){
  const links=WATCH;
  if(links==null)return `<section class="sec" id="b-watch"><h2>내 알림 링크</h2><p class="note">불러오는 중이다.</p></section>`;
  const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}};
  const st={ok:["수집됨","good"],blocked:["자동 수집 불가","bad"],error:["수집 실패","warn"],pending:["업데이트 전","info"]};
  const left=Math.max(0,REFRESH_LIMIT-refreshUsed()),canRefresh=watchMode==="db"&&links.length&&left>0&&!refreshing;
  return `<section class="sec" id="b-watch">
    <div class="sec-head"><h2>내 알림 링크</h2><button class="linkbtn" id="w-add">${watchAdd?'닫기':'+ 링크 등록'}</button></div>
    ${links.length?`<div class="wrefresh"><button class="btn${refreshing?' busy':''}" id="w-refresh" ${canRefresh?'':'disabled'}>${refreshing?'가져오는 중…':left>0?'지금 업데이트':'오늘 횟수 다 씀'}</button>
      <span class="note">${watchMode!=="db"?'로그인하면 쓸 수 있다':`오늘 <b class="num">${left}</b>/${REFRESH_LIMIT}번 남음 · 자정에 다시 3번이 된다`}</span></div>`:''}
    <p class="note">학교·부대 공지, 기관 채용 게시판, 자주 보는 사이트를 등록하면 그곳의 새 글을 매일 아침 모아 준다. 최대 5개. 등록한 주소는 다른 사용자에게 보이지 않지만, 매일 수집을 위해 앱 운영자는 볼 수 있다.</p>
    ${watchAdd?`<form class="form panel pad" id="w-form">
      <input id="w-url" inputmode="url" placeholder="https://..." aria-label="등록할 링크">
      <input id="w-name" placeholder="이름 (선택, 예: 학교 비교과)" aria-label="링크 이름">
      <button class="btn" type="submit">등록</button>
      <p class="note">등록한 뒤 '지금 업데이트'를 누르면 바로 내용을 가져온다. 누르지 않아도 매일 아침 모아 준다.${watchMode==="local"?' 로그인하지 않으면 링크가 이 기기에만 저장되고, 매일 아침 내용 수집은 되지 않는다.':''}</p></form>`:''}
    ${links.length?links.map(l=>{const f=FEEDS[l.id]||{status:"pending"};const [sl,sc]=st[f.status]||st.pending;const items=(f.items||[]).slice(0,5);
      return `<div class="wcard"><div class="whead"><div style="min-width:0"><b>${esc(l.name||host(l.url))}</b><a class="wurl" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(host(l.url))} ↗</a></div>
        <span class="sev ${sc}">${sl}</span></div>
        ${items.length?`<div class="witems">${items.map(it=>`<a class="news" href="${esc(it.url||l.url)}" target="_blank" rel="noopener"><b>${esc(it.t)}</b>${it.s?`<span>${esc(it.s)}</span>`:''}${it.date?`<small>${esc(it.date)}</small>`:''}</a>`).join("")}</div>`:''}
        ${f.note?`<p class="note wnote">${esc(f.note)}</p>`:''}
        <div class="wfoot"><span class="note">${f.fetchedAt?`${new Date(f.fetchedAt).getMonth()+1}.${new Date(f.fetchedAt).getDate()} ${pad2(new Date(f.fetchedAt).getHours())}:${pad2(new Date(f.fetchedAt).getMinutes())} 확인`:`${l.addedAt?new Date(l.addedAt).getMonth()+1+'.'+new Date(l.addedAt).getDate()+' 등록':''}`}</span>
          <button class="seg" data-wdel="${esc(l.id)}">삭제</button></div></div>`}).join(""):'<p class="note pad panel">아직 등록한 링크가 없다.</p>'}
  </section>`;
}

// ===================== 나 리포트 (인바디 결과지 모티브) =====================
let repOpen=false,repPeriod="week";
const PERIODS={day:{l:"일",n:7,prev:"전날"},week:{l:"주",n:8,prev:"지난주"},month:{l:"월",n:6,prev:"지난달"},year:{l:"연",n:5,prev:"작년"}};
function bucketKey(k,per){const d=parseKey(k);if(per==="day")return k;if(per==="month")return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;if(per==="year")return String(d.getFullYear());
  const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(m)}
function bucketLabel(b,per){if(per==="day"){const d=parseKey(b);return `${d.getMonth()+1}.${d.getDate()}`}if(per==="week"){const d=parseKey(b);return `${d.getMonth()+1}.${d.getDate()}주`}
  if(per==="month")return `${+b.slice(5)}월`;return b}
function series(per){const H=S.hist||{};const keys=Object.keys(H).sort();const map={};
  keys.forEach(k=>{const b=bucketKey(k,per);(map[b]||(map[b]=[])).push(H[k])});
  const bs=Object.keys(map).sort().slice(-PERIODS[per].n);
  return bs.map(b=>{const arr=map[b],avg=f=>Math.round(arr.reduce((a,x)=>a+f(x),0)/arr.length);const d={};DOMAINS.forEach(x=>d[x.id]=avg(h=>h.d[x.id]||0));
    const mm={};DOMAINS.forEach(x=>x.metrics.forEach(mt=>{const vs=arr.map(h=>h.m&&h.m[mt.k]).filter(v=>v!=null);if(vs.length)mm[mt.k]=vs.reduce((a,v)=>a+v,0)/vs.length}));

function obFinish(){markDevice();
  const prof={status:OB.status,time:OB.time,focus:OB.focus};
  const recs=recommend(prof,obGet,[],TIMES.find(t=>t.id===OB.time).n);
  const picked=recs.filter((_,i)=>OB.picks.includes(i)).map(r=>({id:"r"+uid(),d:r.d,t:r.t,xp:r.xp,feed:{...r.feed}}));
  if(S.sample){const share=S.share;S=emptyState();ensure();if(share===false)S.share=false;S.quests=picked}
  else{const have=S.quests.map(q=>q.t);picked.forEach(q=>{if(!have.includes(q.t))S.quests.push(q)})}
  S.m={...S.m,...OB.m};S.hobbies=OB.hobbies.slice();
  if(OB.income!==""&&OB.income!=null)S.income=parseWon(OB.income);
  if(OB.goal)S.saveGoal=parseWon(OB.goal);
  S.profile={name:OB.name.trim(),age:OB.age,status:OB.status,branch:MIL(OB.status)?OB.branch:null,time:OB.time,focus:OB.focus.slice(),major:OB.major.trim(),majorGroup:OB.majorGroup,interests:OB.interests.slice(),careers:OB.careers.slice(),at:todayKey()};
  S.onboarded=true;S.obSkipped=false;OB=null;obStep=0;recOffset=0;save();tab="home";render();window.scrollTo(0,0);
  toast(S.profile.name?`${S.profile.name}님, 알파를 시작한다`:"알파를 시작한다");
}

  const qe=t.closest("[data-qedit]");if(qe){qEditing=qe.dataset.qedit;qDel=null;return render()}
  if(t.id==="eq-cancel"){qEditing=null;return render()}
  const qd=t.closest("[data-qdel]");if(qd){const id=qd.dataset.qdel;
    if(qDel!==id){qDel=id;return render()}
    if(id.startsWith("h-"))S.hobbies=S.hobbies.filter(h=>"h-"+h!==id);else S.quests=S.quests.filter(q=>q.id!==id);
    Object.values(S.done).forEach(a=>{const i=a.indexOf(id);if(i>=0)a.splice(i,1)});
    qDel=null;save();render();return toast("퀘스트를 삭제했다")}
  if(t.closest("[data-go-journal]")){tab="today";render();openJournal();return}
  const sl=t.closest("[data-slot]");if(sl){selSlot=sl.dataset.slot;if(selSlot==="간식")mealPro=false;document.querySelectorAll("[data-slot]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.slot===selSlot));const mp=document.getElementById("meal-pro");if(mp)mp.setAttribute("aria-pressed",mealPro);return}
  if(t.id==="meal-pro"){mealPro=!mealPro;t.setAttribute("aria-pressed",mealPro);return}
  const dm=t.closest("[data-delmeal]");if(dm){S.meals[k]=mealsOn(k).filter(m=>m.id!==dm.dataset.delmeal);save();return render()}
  if(t.id==="scr-save"){const raw=document.getElementById("scr-min").value.trim();

  const jm=t.closest("[data-jmode]");if(jm){S.jmode=jm.dataset.jmode;save();return render()}
  if(t.id==="t-toggle"){if(TIMER.running){TIMER.running=false;clearInterval(TIMER.h);TIMER.remain=Math.max(0,(TIMER.endAt-Date.now())/1000)}
    else{TIMER.running=true;TIMER.endAt=Date.now()+TIMER.remain*1000;TIMER.h=setInterval(tick,250)}
    t.textContent=TIMER.running?"일시정지":"계속";if(!TIMER.running)render();return}
  if(t.id==="t-reset"){TIMER.running=false;clearInterval(TIMER.h);TIMER.remain=600;return render()}
  if(t.id==="j-save"){const txt=(document.getElementById("jtext")||{}).value||"";S.draft=txt;
    if(txt.trim().length<10){toast("한두 문장이라도 적어 본다");return}
    const used=Math.round((600-TIMER.remain)/60);finishJournal(used);S.draft="";save();render();toast("일기를 저장했다 · +5 XP");return}
  if(t.id==="al-save"){const v=document.getElementById("al-time").value;if(v){S.alarm.time=v;save();render();toast(`매일 ${v} 알림으로 바꿨다`)}return}
  const ad=t.closest("[data-alday]");if(ad){const d=+ad.dataset.alday,i=S.alarm.days.indexOf(d);if(i>=0){if(S.alarm.days.length===1){toast("최소 하루는 남겨 둔다");return}S.alarm.days.splice(i,1)}else S.alarm.days.push(d);save();return render()}
  if(t.id==="share"){S.share=S.share===false;save();if(S.share===false)withdraw();render();return toast(S.share?"익명 평균에 참여한다":"참여를 중단하고 내 수치를 지웠다")}
  if(t.closest("#ob-return")){S.onboarded=false;obStep=S.obReturn??1;save();return render()}
  if(t.id==="reob")return askConfirm({title:"다시 진단할까?",body:"진단 화면으로 이동한다. 지금까지의 기록은 그대로 두고, 새로 입력한 값으로 결과 지표를 덮어쓴다.",yes:"예, 다시 진단한다",onYes:doReob});
  if(t.closest("[data-login]"))return AUTH.login();
  if(t.id==="logout")return askConfirm({title:"로그아웃할까?",body:"이 기기에 남은 기록 사본을 지우고 로그아웃한다. 계정에 저장된 기록은 그대로 남아서 다시 로그인하면 불러온다.",yes:"로그아웃",onYes:()=>AUTH.logout()});
  if(t.id==="bk-save")return backupNow();
  if(t.id==="bk-load"){const f=document.getElementById("bk-file");if(f)f.click();return}
  if(t.id==="reset")return askConfirm({title:"모든 기록을 지울까?",body:"결과 지표, 퀘스트, 식사·일기, 지출·수입·저축 기록이 모두 삭제되고 되돌릴 수 없다. 지운 뒤 진단부터 다시 시작한다.",yes:"예, 모두 지운다",danger:true,onYes:doReset});
});

// 폼 제출: 버튼 탭과 키보드 Enter 모두 같은 처리로 보낸다. 오류가 나면 화면에 알린다.
document.getElementById("app").addEventListener("click",e=>{const b=e.target.closest('button[type="submit"]');if(!b)return;const f=b.closest("form");if(!f)return;
  e.preventDefault();e.stopPropagation();handleForm(f)},true);

function handleForm(f){try{handleFormInner(f)}catch(err){console.error(err);toast("기록하지 못했다: "+(err&&err.message||err))}}
function handleFormInner(f){
  if(f.id==="w-form"){let u=document.getElementById("w-url").value.trim();if(!/^https?:\/\//i.test(u))u="https://"+u;
    let ok=true;try{const x=new URL(u);if(!x.hostname.includes("."))ok=false}catch(_){ok=false}
    if(!ok){toast("올바른 링크가 아니다. https://로 시작하는 주소를 넣는다");return}
    if((WATCH||[]).length>=5){toast("링크는 5개까지 등록할 수 있다");return}
    if((WATCH||[]).some(l=>l.url===u)){toast("이미 등록한 링크다");return}
    const name=document.getElementById("w-name").value.trim();
    saveWatch([...(WATCH||[]),{id:"w"+uid(),url:u,name,addedAt:new Date().toISOString()}]).then(()=>{watchAdd=false;render();toast(refreshUsed()<REFRESH_LIMIT?"등록했다. '지금 업데이트'를 누르면 바로 가져온다":"등록했다. 내일 아침에 내용을 가져온다")});return}
  if(f.id==="addmeal"){const menu=document.getElementById("meal-menu").value.trim();if(!menu)return;const k=todayKey();
    const before=proteinMeals(k);(S.meals[k]||(S.meals[k]=[])).push({id:"m"+uid(),slot:selSlot,menu,protein:mealPro,at:nowHM()});save();render();
    toast(before<2&&proteinMeals(k)>=2?"단백질 2끼 달성 · +5 XP":`${selSlot} 기록했다`);return}
  if(f.id==="addb"){const v=document.getElementById("nb-t").value.trim();if(!v)return;if(getBase().length>=8){toast("기반은 8개까지 둘 수 있다");return}
    if(getBase().some(b=>b.t===v)){toast("이미 있는 기반이다");return}
    S.base=[...getBase().map(x=>({...x})),{id:"b"+uid(),t:v.slice(0,30),sub:""}];save();render();toast("기반을 추가했다");setTimeout(()=>{const i=document.getElementById("nb-t");if(i)i.focus()},50);return}
  if(f.id==="addq"){const t=document.getElementById("nq-t").value.trim();if(!t)return;const nq={id:"u"+uid(),d:"mind",t,xp:15};applyFeed(nq,document.getElementById("nq-f").value,document.getElementById("nq-amt").value);S.quests.push(nq);save();render();toast("퀘스트를 추가했다")}
  if(f.id==="addexp"){const amt=parseWon(document.getElementById("e-amt").value);if(!amt){toast("금액을 숫자로 입력한다");return}
    S.exp.push({id:"e"+uid(),date:document.getElementById("r-date").value||todayKey(),amt,cat:selCat,tag:document.getElementById("e-tag").value,memo:document.getElementById("e-memo").value.trim(),impulse});
    impulse=false;save();render();toast(`${won(amt)} 기록했다`)}
  if(f.id==="addextra"){const amt=parseWon(document.getElementById("x-amt").value);if(!amt){toast("금액을 숫자로 입력한다");return}
    S.extra.push({id:"x"+uid(),date:document.getElementById("r-date").value||todayKey(),amt,kind:selExtra,memo:document.getElementById("x-memo").value.trim()});save();render();toast(`추가 수입 +${won(amt)}`)}
  if(f.id==="addasset"){const amt=parseWon(document.getElementById("a-amt").value);if(!amt){toast("금액을 숫자로 입력한다");return}
    S.assets.push({id:"a"+uid(),date:document.getElementById("r-date").value||todayKey(),amt,kind:selAsset,memo:document.getElementById("a-memo").value.trim()});save();render();toast(`${selAsset} ${won(amt)} 기록했다`)}
  if(f.id==="editq"){const id=f.dataset.id,t=document.getElementById("eq-t").value.trim();if(!t){toast("내용을 입력한다");return}
    const q=S.quests.find(x=>x.id===id);if(q){q.t=t;q.xp=+document.getElementById("eq-xp").value;applyFeed(q,document.getElementById("eq-f").value,document.getElementById("eq-amt").value)}
    qEditing=null;save();render();toast("퀘스트를 수정했다")}
  if(f.id==="addfix"){const amt=parseWon(document.getElementById("f-amt").value),n=document.getElementById("f-n").value.trim();if(!amt||!n){toast("항목과 금액을 입력한다");return}
    S.fixed.push({id:"f"+uid(),n,amt,kind:document.getElementById("f-kind").value});save();render();toast("고정지출을 추가했다")}
  if(f.id==="setinc"){S.income=parseWon(document.getElementById("inc").value);S.saveGoal=parseWon(document.getElementById("sgoal").value);
    if(S.income&&S.saveGoal>S.income){toast("저축·투자 금액이 수입보다 크다. 숫자를 확인한다");return}save();render();toast("수입을 저장했다")}
}
// ===================== 계정 동기화 =====================
// data/users/<내 id>/state 에 기록 전체(추이 제외), hist 에 하루 단위 추이를 저장한다. 최신 updatedAt이 이긴다.
let CLOUD_READY=false,CLOUD=null,syncState="local",syncAt=null,cloudTimer=null,lastStateBody="",lastHistBody="",pendingLocal=false;
const clean=o=>JSON.parse(JSON.stringify(o));
function stateBody(){const st={...S};delete st.hist;return clean(st)}
// db 스냅샷은 얼어 있는(frozen) 객체라 그대로 쓰면 체크·기록 추가가 조용히 무시된다. 반드시 깊은 복사본을 쓴다.
function adoptRemote(st,h){const keepTab=tab;S={...clean(st),hist:clean(h||S.hist||{})};ensure();if(CLOUD)S.uid=CLOUD.id;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  lastStateBody=JSON.stringify(stateBody());lastHistBody=JSON.stringify(S.hist);
  if(!DEVICE_NEW)OB=null;tab=keepTab;syncState="synced";syncAt=Date.now();renderKeep();renderOB()}
function cloudPush(){if(!CLOUD||S.sample)return;clearTimeout(cloudTimer);syncState="saving";pendingLocal=true;cloudTimer=setTimeout(cloudPushNow,1200)}
async function cloudPushNow(){if(!CLOUD||S.sample)return;const col=CLOUD.db.collection("data/users/"+CLOUD.id);
  try{const sb=stateBody(),sj=JSON.stringify(sb);
    if(sj!==lastStateBody){await col.doc("state").set({s:sb,updatedAt:S.updatedAt||Date.now()});lastStateBody=sj}
    const hj=JSON.stringify(S.hist||{});if(hj!==lastHistBody){await col.doc("hist").set({h:clean(S.hist||{}),updatedAt:S.updatedAt||Date.now()});lastHistBody=hj}
    pendingLocal=false;syncState="synced";syncAt=Date.now();if(tab==="bench")renderKeep()}
  catch(e){syncState=e&&e.code==="invalid_argument"&&!lastStateBody?"readonly":"error";if(syncState==="readonly")CLOUD=null;if(tab==="bench")renderKeep()}}
async function cloudInit(){
  try{
    if(!window.claude||!window.claude.use)throw 0;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    const id=user?await user.id():null;if(!db||!id)throw 0;
    // 다른 계정으로 로그인하면 이 기기에 남은 이전 계정의 기록을 쓰지 않는다
    if(S.uid&&S.uid!==id){S=sampleState();ensure()}S.uid=id;
    // 공유받은 사람이 보기 권한만 있으면 계정에 쓸 수 없다. 이때는 이 기기에만 저장한다(다른 사람 기록과는 절대 섞이지 않는다).
    let canWrite=null;try{canWrite=await user.can("data.write")}catch(_){}
    if(canWrite===false){syncState="readonly";if(tab==="bench")renderKeep();return}
    CLOUD={db,id};const col=db.collection("data/users/"+id);
    const [sn,hn]=await Promise.all([col.doc("state").get(),col.doc("hist").get()]);
    const remote=sn.exists?sn.data():null,rh=hn.exists?(hn.data()||{}).h:null;
    if(remote&&remote.s&&(S.sample||(remote.updatedAt||0)>(S.updatedAt||0))){adoptRemote(remote.s,rh);toast("계정에 저장된 기록을 불러왔다")}
    else if(!S.sample){if(rh&&!Object.keys(S.hist||{}).length)S.hist=clean(rh);await cloudPushNow();if(!remote)toast("기록을 계정에 저장하기 시작했다")}
    else syncState="sample";
    // 다른 기기에서 바뀌면 이 화면에도 반영
    col.doc("state").onSnapshot(x=>{if(!x.exists||(x.metadata&&x.metadata.hasPendingWrites)||pendingLocal)return;const r=x.data();
      if(r&&r.s&&(r.updatedAt||0)>(S.updatedAt||0)){col.doc("hist").get().then(h=>adoptRemote(r.s,h.exists?(h.data()||{}).h:null)).catch(()=>adoptRemote(r.s,null))}},()=>{});
    if(tab==="bench")renderKeep();
  }catch(e){syncState="local";if(tab==="bench")renderKeep()}
  finally{CLOUD_READY=true;render()}
}
watchInit();cloudInit();
// 단축어 알림에서 #journal 로 열면 일기·명상 카드로 이동
function openJournal(){const el=document.getElementById("journal");if(el){el.scrollIntoView({block:"start"});const b=document.getElementById("t-toggle");if(b)b.focus({preventScroll:true})}}

// 열어 둔 상태에서 알림 시간이 지나면 안내가 뜨도록 1분마다 확인 (화면이 홈·오늘일 때만, 입력 중이 아닐 때)
let lastDue=journalDue();setInterval(()=>{const d=journalDue();if(d!==lastDue){lastDue=d;const ae=document.activeElement;if(["home","today"].includes(tab)&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))render();if(d)toast("일기·명상 시간이다")}},60000);

// ===================== 사용자 평균 (공유 db) =====================
// pool/<내 id> 문서 하나에 결과 지표 숫자만 저장. 모든 문서의 평균을 실시간으로 계산.
let DB=null,ME=null,pushTimer=null,lastPushed="";
function myPayload(){const m={};DOMAINS.forEach(d=>d.metrics.forEach(mt=>{if(mt.tier!=="est")return;const v=metricVal(mt);if(typeof v==="number"&&isFinite(v))m[mt.k]=v}));return m}
function schedulePush(){if(!DB||!ME||S.sample||S.share===false)return;clearTimeout(pushTimer);pushTimer=setTimeout(pushNow,2500)}
async function pushNow(){const m=myPayload(),body=JSON.stringify(m);if(body===lastPushed)return;
  try{await DB.collection("pool").doc(ME).set({m,at:new Date().toISOString().slice(0,10)});lastPushed=body}catch(e){POOL_STATUS="저장 권한 없음";if(tab==="bench")render()}}
async function withdraw(){clearTimeout(pushTimer);if(!DB||!ME)return;try{await DB.collection("pool").doc(ME).delete();lastPushed=""}catch(e){}}
(async()=>{
  try{
    if(!window.claude||!window.claude.use){POOL_STATUS="오프라인";return}
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db){POOL_STATUS="로그인 시 참여 가능";if(tab==="bench")render();return}
    DB=db;ME=user?await user.id():null;
    db.collection("pool").onSnapshot(snap=>{
      const acc={};
      snap.docs.forEach(doc=>{const m=(doc.data()||{}).m;if(!m||typeof m!=="object")return;
        DOMAINS.forEach(d=>d.metrics.forEach(mt=>{if(mt.tier!=="est")return;const v=Number(m[mt.k]);
          if(!isFinite(v)||v<0||v>(mt.max||100))return; // 범위 밖 값은 제외
          (acc[mt.k]||(acc[mt.k]={n:0,sum:0})).n++;acc[mt.k].sum+=v}))});
      POOL={};Object.entries(acc).forEach(([k,a])=>POOL[k]={n:a.n,mean:a.sum/a.n});
      POOL_STATUS=`참여 ${snap.size}명`;if(["home","log","bench"].includes(tab))render();
    },()=>{POOL_STATUS="연결 끊김";if(tab==="bench")render()});
    schedulePush();if(S.share===false)withdraw();
  }catch(e){POOL_STATUS="연결 실패"}
})();
const MARK_URI=(document.querySelector('link[rel="icon"]')||{}).href||"";
(()=>{const st=document.createElement("style");st.textContent=`:root{--mark-img:url("${MARK_URI}")}`+SHEET_CSS;document.head.appendChild(st)})();
if(S.sample&&!S.hist)S.hist=sampleHist();
try{recordSnap();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){setTimeout(()=>toast("이 브라우저는 기기 저장을 막고 있다. 로그인 상태로 열어야 기록이 남는다"),800)}
render();routeHash();
</script>
